# 字型設定檔：每個 section 對應程式中的一個 GlyphFont，路徑相對於這個資料夾。
#   gfnt.<字號> = <檔案>  事先點陣化的字型，可以有多個字號；有對應字號的 GFNT 時一律優先使用
#   gotl = <檔案>         向量字型，適用沒有 GFNT 的其他字號
# 只有 GFNT 的像素字型，字號為 GFNT 字號的整數倍時會整數倍放大。

[CUBIC11]
gfnt.12 = Cubic-11/Cubic11-12.gfnt

[UNIFONT]
gfnt.16 = unifont/unifont-16.gfnt

# 20 px 以下用保有 hinting 的 GFNT，其他字號由 GOTL 點陣化。
[NOTO_SANS_CJK_TC]
gfnt.12 = NotoSansCJKtc/NotoSansCJKtc-Regular-12.gfnt
gfnt.14 = NotoSansCJKtc/NotoSansCJKtc-Regular-14.gfnt
gfnt.16 = NotoSansCJKtc/NotoSansCJKtc-Regular-16.gfnt
gfnt.20 = NotoSansCJKtc/NotoSansCJKtc-Regular-20.gfnt
gotl = NotoSansCJKtc/NotoSansCJKtc-Regular.gotl
